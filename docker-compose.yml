# Usage:
#   cp .env.example .env    # set SESSION_SECRET and POSTGRES_PASSWORD
#   docker compose up -d --build
# Open http://localhost:3000

services:
  app:
    build: .
    image: boklyai:local
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      UPLOAD_DIR: /data/uploads
    ports:
      - "${HOST_PORT:-3000}:3000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-boklyai}
      POSTGRES_USER: ${POSTGRES_USER:-boklyai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published: only the app container can reach the database.

volumes:
  pgdata:
  uploads:
