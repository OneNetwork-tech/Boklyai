name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: boklyai
          POSTGRES_PASSWORD: boklyai
          POSTGRES_DB: boklyai_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U boklyai"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --ci
        env:
          TEST_DATABASE_URL: postgres://boklyai:boklyai@localhost:5432/boklyai_test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --audit-level=high

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t boklyai:ci .
      - name: Smoke test
        run: |
          docker network create bk
          docker run -d --name db --network bk -e POSTGRES_USER=bk -e POSTGRES_PASSWORD=bk -e POSTGRES_DB=bk postgres:16-alpine
          for i in $(seq 1 30); do docker exec db pg_isready -U bk && break; sleep 1; done
          docker run -d --name app --network bk -p 3000:3000 \
            -e SESSION_SECRET=ci-session-secret-ci-session-secret-1234 \
            -e DATABASE_URL=postgres://bk:bk@db:5432/bk boklyai:ci
          for i in $(seq 1 40); do curl -fsS http://localhost:3000/api/health && break; sleep 1; done
          curl -fsS http://localhost:3000/ | grep -q '<div id="root">'
          docker exec app tesseract --version
          docker exec app pdftotext -v
          docker logs app

  # CD part 1: every push (any branch, v* tags) publishes the image to GitHub Container Registry.
  #   ghcr.io/<owner>/boklyai:<branch>   e.g. claude-charming-noether-lhy664
  #   ghcr.io/<owner>/boklyai:sha-<7>    one per commit
  #   ghcr.io/<owner>/boklyai:latest     default branch only
  publish:
    if: github.event_name != 'pull_request'
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/boklyai
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=boklyai
          cache-to: type=gha,mode=max,scope=boklyai

  # CD part 2 (optional): deploy to your own server through a self-hosted runner with the
  # label "local-server". Turn it on by setting the repository variable LOCAL_DEPLOY_BRANCH
  # to the branch that should auto-deploy. The server keeps its secrets in
  # $LOCAL_DEPLOY_DIR/.env (default ~/apps/boklyai), created once from deploy/.env.example.
  deploy-local:
    if: github.event_name == 'push' && vars.LOCAL_DEPLOY_BRANCH == github.ref_name
    needs: publish
    runs-on: [self-hosted, local-server]
    concurrency: deploy-local-boklyai
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy
        env:
          LOCAL_DEPLOY_DIR: ${{ vars.LOCAL_DEPLOY_DIR }}
        run: |
          DIR="${LOCAL_DEPLOY_DIR:-$HOME/apps/boklyai}"
          mkdir -p "$DIR"
          cp deploy/docker-compose.yml deploy/deploy.sh deploy/.env.example "$DIR/"
          if [ ! -f "$DIR/.env" ]; then
            echo "::error::Create $DIR/.env on the server (copy .env.example and fill in the secrets)"
            exit 1
          fi
          "$DIR/deploy.sh" "sha-${GITHUB_SHA::7}"
