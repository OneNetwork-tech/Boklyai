name: Build and Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js for backend
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Run backend tests
        run: npm test -- --runInBand
        working-directory: backend
        env:
          CI: true

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run frontend tests
        run: npm test -- --watchAll=false
        working-directory: frontend
        env:
          CI: true

      - name: Build frontend bundle
        run: npm run build
        working-directory: frontend
        env:
          CI: true

      - name: Setup Python for AI services
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install AI service dependencies
        run: pip install -r requirements.txt
        working-directory: ai-services

      - name: Run AI service tests
        run: pytest
        working-directory: ai-services

  build-and-push-images:
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            image: backend
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            image: frontend
          - name: ai
            context: ./ai-services
            dockerfile: ./ai-services/Dockerfile
            image: ai-services
    env:
      REGISTRY: ghcr.io
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Derive lowercase repository name
        id: repo
        run: |
          echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }} image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}-${{ matrix.image }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.name }}-${{ matrix.image }}:latest

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build-and-push-images
    if: ${{ secrets.STAGING_HOST != '' && secrets.STAGING_USER != '' && secrets.STAGING_SSH_KEY != '' }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /var/www/boklyai
            git pull origin main
            docker compose pull || true
            docker compose up -d --build
